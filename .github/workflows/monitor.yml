name: OECD Korea CLI Monitor

on:
  schedule:
    # 매일 UTC 09:00 (한국 시간 18:00) 자동 실행
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "새 발표가 없어도 강제로 텔레그램 알림 보내기"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: cli-monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          # 만료되지 않는 기본 GITHUB_TOKEN을 사용하여 영구 무중단 실행 보장
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch data and notify
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FORCE_NOTIFY: ${{ inputs.force }}
        run: python scripts/update.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive/heartbeat.txt
          git add docs/data/kor_cli.json .keepalive/heartbeat.txt
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "chore: update KOR CLI data"
            for i in 1 2 3; do
              git push origin main && break
              echo "push 재시도 $i"
              sleep 5
              git pull origin main --rebase --autostash || true
            done
          fi

      - name: Keep workflow active
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/monitor.yml/enable" \
          && echo "워크플로 활성 유지 완료" \
          || echo "API 호출 완료(무시 가능)"

      - name: Check PAT expiry
        if: always()
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check_token.py || true

  alert-on-failure:
    needs: update
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify failure
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
        run: |
          MSG="⚠️ CLI 봇 실행 실패%0A오늘 데이터 수집 과정에서 오류가 발생했습니다.%0A확인: https://github.com/${REPO}/actions"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="${MSG}"
